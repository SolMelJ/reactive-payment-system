server.port=8081

# Имя нашего второго сервиса
spring.application.name=payment-consumer

# Настройки подключения к RabbitMQ (откуда забираем)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Настройки подключения к PostgreSQL (куда сохраняем)
# В адресе указан порт 5432 и имя базы данных (пусть будет payments_db)
# Новые правильные настройки подключения к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=myuser
spring.datasource.password=mypassword

# Магия Hibernate (часть JPA): она автоматически создаст таблицу в базе данных,
# если её там еще нет, опираясь на наш Java-код!
spring.jpa.hibernate.ddl-auto=update
# Включаем красивый вывод SQL-запросов в консоль, чтобы видеть, как данные ложатся в таблицы
spring.jpa.show-sql=true

spring.jpa.open-in-view=false   